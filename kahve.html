<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Okan Bayındır'a Kahve Ismarla</title>
  <style>
    :root {
      --bg: #0b0d12;
      --card: #161922;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f5f5f7;
      --muted: #98989f;
      --accent: #0071e3;
      --accent-soft: rgba(0, 113, 227, 0.16);
      --coffee: #f59e0b;
      --coffee-soft: rgba(245, 158, 11, 0.16);
      --ok: #30d158;
      --ok-soft: rgba(48, 209, 88, 0.16);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #1b2030 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      background: #143321;
      border: 1px solid rgba(48, 209, 88, 0.55);
      color: #d9ffe4;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .card {
      width: 100%;
      max-width: 410px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 26px 22px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
    }
    .icon-box {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--coffee-soft);
      border: 1px solid rgba(245, 158, 11, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 26px;
    }
    h1 {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.2px;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 18px;
    }
    .tiers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .tier {
      background: rgba(255,255,255,0.04);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 10px 6px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .tier.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    .tier-cups { font-size: 15px; margin-bottom: 3px; }
    .tier-name { font-size: 12.5px; color: var(--text); font-weight: 600; }
    .tier-price { font-size: 15px; font-weight: 700; color: var(--text); margin-top: 2px; }
    .tier.active .tier-price { color: #4da3ff; }

    .notice {
      border-radius: 16px;
      padding: 15px 14px;
      margin-bottom: 16px;
      border: 1px solid rgba(48, 209, 88, 0.4);
      background: var(--ok-soft);
      text-align: left;
      display: none;
    }
    .notice.show { display: block; animation: pop 0.25s ease; }
    .notice.pending {
      display: block;
      border-color: rgba(245, 158, 11, 0.45);
      background: var(--coffee-soft);
    }
    .notice-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--ok);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .notice.pending .notice-title { color: var(--coffee); }
    .notice-desc {
      font-size: 13px;
      color: #d6d9e0;
      line-height: 1.45;
    }
    .meta-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
    }
    .meta-label { color: var(--muted); }
    .meta-val { font-weight: 700; color: var(--text); }

    .btn-primary {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      margin-bottom: 10px;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    .btn-primary:active { transform: scale(0.985); opacity: 0.9; }
    .btn-secondary {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13.5px;
      font-weight: 600;
      background: rgba(255,255,255,0.05);
      color: var(--text);
      cursor: pointer;
    }
    .btn-secondary:active { opacity: 0.85; }
    @keyframes pop {
      0% { transform: scale(0.97); opacity: 0.6; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="toast" class="toast">✓ IBAN panoya kopyalandı!</div>

  <div class="card">
    <div class="icon-box">☕</div>
    <h1>Okan Bayındır'a Kahve Ismarla</h1>
    <p class="sub">Desteğiniz Püsü IPTV'nin gelişimine güç katar. Teşekkürler!</p>

    <div class="tiers">
      <div class="tier" id="tier-150" onclick="selectTier(150, event)">
        <div class="tier-cups">☕</div>
        <div class="tier-name">Küçük</div>
        <div class="tier-price">150 TL</div>
      </div>
      <div class="tier" id="tier-300" onclick="selectTier(300, event)">
        <div class="tier-cups">☕☕</div>
        <div class="tier-name">Orta</div>
        <div class="tier-price">300 TL</div>
      </div>
      <div class="tier" id="tier-450" onclick="selectTier(450, event)">
        <div class="tier-cups">☕☕☕</div>
        <div class="tier-name">Büyük</div>
        <div class="tier-price">450 TL</div>
      </div>
    </div>

    <div id="noticeBox" class="notice">
      <div id="noticeTitle" class="notice-title">✓ IBAN Panoya Kopyalandı!</div>
      <div id="noticeDesc" class="notice-desc"></div>
    </div>

    <div class="meta-box">
      <span class="meta-label">Alıcı Adı Soyadı</span>
      <span class="meta-val">Okan Bayındır</span>
    </div>

    <button id="btnCopyIban" class="btn-primary" onclick="copyIban(false)">IBAN'ı Kopyala</button>
    <button class="btn-secondary" onclick="copyRecipient(event)">Alıcı Adını Kopyala (Okan Bayındır)</button>
  </div>

  <script>
    (function () {
      // Yalnızca panoya kopyalanır, ekranda açık metin olarak yazılmaz
      const p = ["TR57", "0001", "0024", "6963", "1000", "6250", "07"];
      const IBAN_CLEAN = p.join("");
      const RECIPIENT = "Okan Bayındır";

      const params = new URLSearchParams(window.location.search);
      let currentTier = parseInt(params.get("t") || "150", 10);
      if (![150, 300, 450].includes(currentTier)) currentTier = 150;
      const sessionCode = params.get("s") || "";
      let notifiedServer = false;
      let hasCopiedOnce = false;

      function tierLabel(amt) {
        if (amt === 300) return "Orta Kahve (300 TL)";
        if (amt === 450) return "Büyük Kahve (450 TL)";
        return "Küçük Kahve (150 TL)";
      }

      function renderTiers() {
        [150, 300, 450].forEach(function (amt) {
          const el = document.getElementById("tier-" + amt);
          if (el) el.classList.toggle("active", amt === currentTier);
        });
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(function () {
          t.classList.remove("show");
        }, 3200);
      }

      function updateNotice(copied) {
        const box = document.getElementById("noticeBox");
        const title = document.getElementById("noticeTitle");
        const desc = document.getElementById("noticeDesc");
        const btn = document.getElementById("btnCopyIban");

        if (copied) {
          box.className = "notice show";
          title.textContent = "✓ IBAN Panoya Kopyalandı!";
          desc.textContent = "Mobil bankacılık uygulamanızı açıp IBAN alanına yapıştırarak " + currentTier + " TL (" + tierLabel(currentTier) + ") gönderebilirsiniz.";
          btn.textContent = "✓ IBAN Kopyalandı (Tekrar Kopyala)";
        } else {
          box.className = "notice pending";
          title.textContent = "📋 Tek Dokunuşla IBAN Kopyala";
          desc.textContent = currentTier + " TL (" + tierLabel(currentTier) + ") göndermek için ekrana veya aşağıdaki butona dokunarak IBAN'ı kopyalayın.";
          btn.textContent = "IBAN'ı Kopyala (" + currentTier + " TL)";
        }
      }

      function fallbackCopyText(text) {
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.top = "-9999px";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, text.length);
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          return ok;
        } catch (e) {
          return false;
        }
      }

      async function writeClip(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (e) { }
        }
        return fallbackCopyText(text);
      }

      async function notifyDesktopApp() {
        if (notifiedServer || !sessionCode) return;
        notifiedServer = true;
        try {
          const authRes = await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=AIzaSyCas4TV9AjWerqK3_Qrs6tGONd82ggjwEw", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: "qr_relay@pusuiptv.app",
              password: "PusuQrRelay2026!",
              returnSecureToken: true
            })
          });
          if (!authRes.ok) return;
          const authData = await authRes.json();
          const url = "https://pusu-iptv-default-rtdb.europe-west1.firebasedatabase.app/users/" + authData.localId + "/qr_sessions/coffee_" + encodeURIComponent(sessionCode) + ".json?auth=" + authData.idToken;
          await fetch(url, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              status: "copied",
              amount: currentTier,
              ts: Date.now()
            })
          });
        } catch (e) { }
      }

      window.copyIban = async function (isAuto) {
        const ok = await writeClip(IBAN_CLEAN);
        if (ok) {
          hasCopiedOnce = true;
          if (navigator.vibrate) { try { navigator.vibrate(35); } catch (e) {} }
          updateNotice(true);
          showToast("✓ IBAN panoya kopyalandı! (" + currentTier + " TL)");
          notifyDesktopApp();
        } else if (isAuto) {
          updateNotice(false);
        }
      };

      window.copyRecipient = async function (ev) {
        if (ev) ev.stopPropagation();
        const ok = await writeClip(RECIPIENT);
        if (ok) {
          if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }
          showToast("✓ Alıcı adı kopyalandı: Okan Bayındır");
        }
      };

      window.selectTier = function (amt, ev) {
        if (ev) ev.stopPropagation();
        currentTier = amt;
        renderTiers();
        copyIban(false);
      };

      // İlk dokunuşta (iOS Safari güvenlik politikası için) otomatik kopyala
      document.addEventListener("pointerdown", function onFirstTouch() {
        if (!hasCopiedOnce) {
          copyIban(false);
        }
        document.removeEventListener("pointerdown", onFirstTouch);
      }, { passive: true });

      renderTiers();
      copyIban(true);
      notifyDesktopApp();
    })();
  </script>
</body>
</html>
