<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Püsü IPTV — İndiriliyor</title>
    <script>
        (function() {
            try {
                var savedTheme = localStorage.getItem('pusu_theme');
                if (savedTheme === 'dark' || savedTheme === 'light') {
                    document.documentElement.setAttribute('data-theme', savedTheme);
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}

            var downloadUrl = 'https://github.com/Okan707/pusu.iptv/releases/download/19.0.0/Pusu_IPTV_Setup.exe';
            var currentUrl = window.location.href;
            if (currentUrl.indexOf('Pusu_IPTV_Setup.exe') !== -1) {
                window.location.replace(downloadUrl);
            } else {
                window.location.replace('https://okan707.github.io/pusu.iptv/');
            }
        })();
    </script>
    <meta http-equiv="refresh" content="0; url=https://github.com/Okan707/pusu.iptv/releases/download/19.0.0/Pusu_IPTV_Setup.exe">
    <style>
        :root,
        [data-theme="light"] {
            --bg-page: #F5F5F7;
            --bg-card: #FFFFFF;
            --text-primary: #1D1D1F;
            --text-secondary: #6E6E73;
            --border-card: rgba(0, 0, 0, 0.06);
            --apple-blue: #0071E3;
            --apple-blue-hover: #0077ED;
            --shadow-card: 0 12px 40px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
        }

        [data-theme="dark"] {
            --bg-page: #000000;
            --bg-card: #1C1C1E;
            --text-primary: #F5F5F7;
            --text-secondary: #A1A1A6;
            --border-card: rgba(255, 255, 255, 0.10);
            --apple-blue: #0A84FF;
            --apple-blue-hover: #409CFF;
            --shadow-card: 0 16px 48px rgba(0, 0, 0, 0.6), 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
        }
        .box {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            max-width: 440px;
            width: 100%;
            box-shadow: var(--shadow-card);
        }
        h2 {
            margin-top: 0;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }
        p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }
        a.btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.85rem 1.75rem;
            background: var(--apple-blue);
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 980px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s ease;
        }
        a.btn:hover {
            background: var(--apple-blue-hover);
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Püsü IPTV v19.0 İndiriliyor...</h2>
        <p>İndirme işleminiz birkaç saniye içinde otomatik olarak başlayacaktır.</p>
        <p>Eğer indirme otomatik başlamadıysa aşağıdaki butona tıklayabilirsiniz:</p>
        <a class="btn" href="https://github.com/Okan707/pusu.iptv/releases/download/19.0.0/Pusu_IPTV_Setup.exe">Hemen İndir (v19.0)</a>
    </div>
</body>
</html>
