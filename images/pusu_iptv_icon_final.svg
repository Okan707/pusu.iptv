<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Cyber Background patterns -->
    <path d="M20 100 L180 100 M100 20 L100 180" stroke="#00ffff" stroke-width="1" opacity="0.2" />
    <circle cx="100" cy="100" r="80" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.3"
        stroke-dasharray="5,10" />

    <!-- Cat Silhouette -->
    <path d="M60 140 Q100 160 140 140 L150 70 Q150 40 130 50 L100 70 L70 50 Q50 40 50 70 Z"
        fill="#1e293b" />
    <path d="M60 140 Q100 160 140 140 L150 70 Q150 40 130 50 L100 70 L70 50 Q50 40 50 70 Z"
        fill="none" stroke="#00ffff" stroke-width="3" />

    <!-- Cyber Eyes -->
    <circle cx="80" cy="110" r="10" fill="#00ffff" />
    <circle cx="120" cy="110" r="10" fill="#00ffff" />
    <circle cx="80" cy="110" r="4" fill="white" />
    <circle cx="120" cy="110" r="4" fill="white" />

    <!-- Play Button Collar -->
    <circle cx="100" cy="155" r="15" fill="#ff8c00" />
    <path d="M95 148 L110 155 L95 162 Z" fill="white" />

    <!-- Circuit lines -->
    <path d="M70 125 L40 125 M130 125 L160 125" stroke="#ff8c00" stroke-width="2" />
    <path d="M100 70 L100 40" stroke="#ff8c00" stroke-width="2" />
</svg>